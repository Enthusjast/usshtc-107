appId: com.ustc.usshtc107
productName: "usshtc107"
copyright: "Copyright 2026"

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - shared/**/*
  - cli/**/*
  - dist/**/*
  - LICENSE
  - '!node_modules/{buildcheck,cpu-features,nan}/**/*'
  - package.json

asar: true
npmRebuild: false
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
electronUpdaterCompatibility: '>=2.16'

publish:
  provider: github
  owner: Enthusjast
  repo: usshtc-107
  private: false
  protocol: https
  channel: latest
  tagNamePrefix: v
  releaseType: release

linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icon.png
  syncDesktopName: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.utilities
  icon: build/icon.icns
  hardenedRuntime: true
  notarize: true
  forceCodeSigning: true

dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true
  forceCodeSigning: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  unicode: true
