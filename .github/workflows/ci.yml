name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        shell: bash
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.18.0
          [[ "$(npm --version)" == "11.18.0" ]]

      - name: Install dependencies
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'
        run: npm ci

      - name: Provision Electron binary with bundled checksums
        run: node node_modules/electron/install.js

      - name: Check Electron source syntax
        run: npm run check:electron

      - name: Install legacy SCP acceptance clients
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-client putty-tools
          echo "PSCP_BINARY=/usr/bin/pscp" >> "$GITHUB_ENV"
          echo "PUTTYGEN_BINARY=/usr/bin/puttygen" >> "$GITHUB_ENV"

      - name: Run Node and real transport tests three consecutive times on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Node regression pass ${attempt}/3 on ${RUNNER_OS}"
            npm run test:node
          done

      - name: Run Node and real transport tests three consecutive times on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sshDirectory = Join-Path $env:WINDIR 'System32/OpenSSH'
          $ssh = Join-Path $sshDirectory 'ssh.exe'
          if (!(Test-Path $ssh)) { throw 'Native Windows OpenSSH client is unavailable' }
          $env:PATH = "$sshDirectory;$env:PATH"
          & $ssh -V
          foreach ($attempt in 1..3) {
            Write-Host "Node regression pass $attempt/3 on $env:RUNNER_OS"
            npm run test:node
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run renderer interaction tests
        id: renderer_tests
        env:
          USSHTC107_VITEST_REPORT_FILE: test-results/renderer-initial.json
        run: npm run test:ui -- --reporter=default --reporter=./scripts/ci-vitest-reporter.cjs

      - name: Enforce Node coverage thresholds
        if: runner.os == 'Linux'
        run: npm run test:node:coverage

      - name: Enforce renderer coverage thresholds
        id: renderer_coverage
        if: runner.os == 'Linux'
        env:
          USSHTC107_VITEST_REPORT_FILE: test-results/renderer-coverage.json
        run: npm run test:ui:coverage -- --reporter=default --reporter=./scripts/ci-vitest-reporter.cjs

      - name: Diagnose failed renderer files once without clearing the original failure
        if: failure() && (steps.renderer_tests.outcome == 'failure' || steps.renderer_coverage.outcome == 'failure')
        run: node scripts/rerun-ui-failures.cjs test-results/renderer-initial.json test-results/renderer-coverage.json

      - name: Build renderer
        run: npm run build

      - name: Prepare Linux Electron sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          test -f node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run source Electron acceptance on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron -- --output=test-results/source

      - name: Run source Electron acceptance on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:electron -- --output=test-results/source

      - name: Audit the complete dependency graph
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: npm run package:smoke

      - name: Run packaged Linux Electron acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x release/linux-unpacked/usshtc107
          test -f release/linux-unpacked/resources/app.asar
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          APP_EXECUTABLE="$GITHUB_WORKSPACE/release/linux-unpacked/usshtc107" \
            xvfb-run -a npm run test:electron:packaged -- --output=test-results/packaged

      - name: Retain Electron runtime screenshots and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-runtime-ci-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
