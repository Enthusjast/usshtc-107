name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        shell: bash
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.18.0
          [[ "$(npm --version)" == "11.18.0" ]]

      - name: Install dependencies
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'
        run: npm ci

      - name: Check Electron source syntax
        run: npm run check:electron

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Build renderer
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package Linux application
        run: npm run package:smoke

      - name: Verify packaged application
        shell: bash
        run: |
          test -x release/linux-unpacked/usshtc107
          test -f release/linux-unpacked/resources/app.asar
