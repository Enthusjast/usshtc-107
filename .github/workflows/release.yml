name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - mac
          - win
      release:
        description: Create or update a GitHub Release
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request and version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_SHA: ${{ github.sha }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { version } = require('./package.json');
          const expectedTag = `v${version}`;
          const releaseRequested = process.env.EVENT_NAME === 'push'
            || process.env.REQUESTED_RELEASE === 'true';
          const platformBuildRequested = process.env.EVENT_NAME === 'push'
            || ['all', 'mac', 'win'].includes(process.env.REQUESTED_PLATFORM);

          if (releaseRequested && process.env.REF_TYPE !== 'tag') {
            throw new Error('A GitHub Release must be dispatched from a tag');
          }
          if (process.env.REF_TYPE === 'tag' && process.env.REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.REF_NAME} does not match package version ${expectedTag}`);
          }
          if (process.env.REQUESTED_RELEASE === 'true'
            && process.env.REQUESTED_PLATFORM !== 'all') {
            throw new Error('A GitHub Release must include all platforms');
          }
          if (process.env.EVENT_NAME === 'workflow_dispatch'
            && platformBuildRequested
            && process.env.REF_TYPE === 'branch'
            && process.env.REF_NAME !== process.env.DEFAULT_BRANCH) {
            throw new Error('Platform builds must be dispatched from the default branch or a version tag');
          }
          if (process.env.REF_TYPE === 'tag' && (releaseRequested || platformBuildRequested)) {
            const ancestry = spawnSync('git', [
              'merge-base',
              '--is-ancestor',
              process.env.GITHUB_SHA,
              `origin/${process.env.DEFAULT_BRANCH}`,
            ]);
            if (ancestry.status !== 0) {
              throw new Error('The release tag must point to a commit on the default branch');
            }
          }
          NODE

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Select platform
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$REQUESTED_PLATFORM" == "all" || "$REQUESTED_PLATFORM" == "$MATRIX_TARGET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.select.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Probe native keychain environment
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'mac'
        run: node scripts/probe-native-keychain.cjs

      - name: Set up Node.js
        if: steps.select.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.18.0
          [[ "$(npm --version)" == "11.18.0" ]]

      - name: Install dependencies
        if: steps.select.outputs.enabled == 'true'
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'
        run: npm ci

      - name: Provision Electron binary with bundled checksums
        if: steps.select.outputs.enabled == 'true'
        run: node node_modules/electron/install.js

      - name: Run release checks
        if: steps.select.outputs.enabled == 'true'
        run: npm run check

      - name: Generate macOS icon
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'mac'
        run: npm run build:mac-icon

      - name: Package ${{ matrix.target }}
        if: steps.select.outputs.enabled == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm exec electron-builder -- --${{ matrix.target }} --publish never

      - name: Verify Linux packages
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          app_images=(release/*.AppImage)
          deb_packages=(release/*.deb)
          ((${#app_images[@]} == 1)) || { echo 'Expected exactly one Linux AppImage' >&2; exit 1; }
          ((${#deb_packages[@]} == 1)) || { echo 'Expected exactly one Debian package' >&2; exit 1; }

      - name: Verify macOS packages
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'mac'
        shell: bash
        run: |
          shopt -s nullglob
          app_paths=(release/mac*/*.app)
          ((${#app_paths[@]} == 2)) || { echo 'Expected x64 and arm64 macOS app bundles' >&2; exit 1; }

          dmg_paths=(release/*.dmg)
          ((${#dmg_paths[@]} == 2)) || { echo 'Expected x64 and arm64 macOS disk images' >&2; exit 1; }

      - name: Verify Windows packages
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'win'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -File -Filter *.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }

          $applications = @(Get-ChildItem release -Recurse -File -Filter usshtc107.exe)
          if ($applications.Count -ne 1) { throw 'Expected exactly one Windows application executable' }


      - name: Verify update metadata before runtime acceptance
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { verifyUpdateArtifacts } = require('./scripts/verify-update-artifacts.cjs');
          const directory = fs.mkdtempSync(path.join(process.env.GITHUB_WORKSPACE, '.update-artifacts-'));
          const excluded = new Set([
            'linux-unpacked', 'win-unpacked', 'mac', 'mac-arm64',
            'builder-debug.yml', 'builder-effective-config.yaml', '.icon-ico',
          ]);
          (async () => {
            try {
              for (const name of fs.readdirSync('release')) {
                if (!excluded.has(name)) fs.linkSync(path.join('release', name), path.join(directory, name));
              }
              await verifyUpdateArtifacts({
                directory, platform: process.env.MATRIX_TARGET, version: require('./package.json').version,
              });
            } finally {
              fs.rmSync(directory, { recursive: true, force: true });
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Run native Linux packaged Electron acceptance
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'linux'
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          test -x release/linux-unpacked/usshtc107
          test -f release/linux-unpacked/resources/app.asar
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          APP_EXECUTABLE="$GITHUB_WORKSPACE/release/linux-unpacked/usshtc107" \
            xvfb-run -a npm run test:electron:packaged -- --output=test-results/packaged

      - name: Verify real Debian package update eligibility
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          deb_packages=(release/*.deb)
          ((${#deb_packages[@]} == 1)) || { echo 'Expected exactly one Debian package' >&2; exit 1; }
          extracted=$(mktemp -d "$RUNNER_TEMP/usshtc107-deb-runtime.XXXXXX")
          trap 'rm -rf -- "$extracted"' EXIT
          dpkg-deb --extract "${deb_packages[0]}" "$extracted"
          test -x "$extracted/opt/usshtc107/usshtc107"
          test -f "$extracted/opt/usshtc107/resources/app.asar"
          test "$(cat "$extracted/opt/usshtc107/resources/package-type")" = deb
          sudo chown root:root "$extracted/opt/usshtc107/chrome-sandbox"
          sudo chmod 4755 "$extracted/opt/usshtc107/chrome-sandbox"
          APP_EXPECTED_UPDATE_MODE=manual APP_EXECUTABLE="$extracted/opt/usshtc107/usshtc107" \
            xvfb-run -a npm run test:electron:packaged -- --output=test-results/packaged-deb

      - name: Run native Windows packaged Electron acceptance
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'win'
        shell: pwsh
        run: |
          $env:APP_EXECUTABLE = (Resolve-Path 'release/win-unpacked/usshtc107.exe').Path
          npm run test:electron:packaged -- --output=test-results/packaged

      - name: Run host-architecture macOS packaged Electron acceptance
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'mac'
        shell: bash
        run: |
          case "$(node -p process.arch)" in
            arm64) app_directory=release/mac-arm64 ;;
            x64) app_directory=release/mac ;;
            *) echo 'Unsupported native macOS architecture' >&2; exit 1 ;;
          esac
          (
            sleep 45
            mkdir -p test-results
            pid=$(pgrep -n -x usshtc107)
            sample "$pid" 1 1 -file "$GITHUB_WORKSPACE/test-results/macos-main.sample.txt"
            screencapture -x "$GITHUB_WORKSPACE/test-results/macos-desktop.png"
          ) &
          observer=$!
          APP_EXECUTABLE="$GITHUB_WORKSPACE/$app_directory/usshtc107.app/Contents/MacOS/usshtc107" \
            npm run test:electron:packaged -- --output=test-results/packaged
          kill "$observer" 2>/dev/null || true
          wait "$observer" 2>/dev/null || true

      - name: Retain native packaged runtime screenshots and traces
        if: always() && steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-runtime-release-${{ matrix.target }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Exclude unpacked and builder diagnostics
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        run: |
          rm -rf -- release/linux-unpacked release/win-unpacked release/mac release/mac-arm64 release/.icon-ico
          rm -f -- release/builder-debug.yml release/builder-effective-config.yaml

      - name: Verify final update artifacts
        if: steps.select.outputs.enabled == 'true'
        run: node scripts/verify-update-artifacts.cjs release ${{ matrix.target }}

      - name: Upload ${{ matrix.target }} artifacts
        if: steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usshtc107-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    if: github.event_name == 'push' || inputs.release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up npm
        shell: bash
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.18.0
          [[ "$(npm --version)" == "11.18.0" ]]

      - name: Install artifact verification dependencies
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: 'true'
        run: npm ci --omit=dev

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: usshtc107-*
          merge-multiple: true
          path: artifacts

      - name: Verify complete release update artifacts
        run: node scripts/verify-update-artifacts.cjs artifacts all

      - name: Generate SBOM and checksums
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          sbom_dir=$(mktemp -d "$RUNNER_TEMP/usshtc107-sbom.XXXXXX")
          sbom_path="$GITHUB_WORKSPACE/artifacts/usshtc107-${version}.cdx.json"
          trap 'status=$?; rm -rf -- "$sbom_dir"; exit "$status"' EXIT
          cp package.json package-lock.json "$sbom_dir/"

          (
            cd "$sbom_dir"
            npm pkg delete devDependencies optionalDependencies allowScripts
            npm install --package-lock-only --omit=optional --ignore-scripts \
              --no-audit --no-fund
            npm ci --omit=optional --ignore-scripts --no-audit --no-fund
            npm ls --all --omit=optional --json > installed.json
            npm sbom --omit=optional \
              --sbom-format=cyclonedx --sbom-type=application \
              > "$sbom_path"
          )

          SBOM_DIR="$sbom_dir" SBOM_PATH="$sbom_path" node <<'NODE'
          const path = require('node:path');

          const sourceLock = require(path.join(process.env.GITHUB_WORKSPACE, 'package-lock.json'));
          const sbomLock = require(path.join(process.env.SBOM_DIR, 'package-lock.json'));
          for (const [packagePath, entry] of Object.entries(sbomLock.packages || {})) {
            if (!packagePath) continue;
            const sourceEntry = sourceLock.packages?.[packagePath];
            if (!sourceEntry
              || entry.version !== sourceEntry.version
              || entry.integrity !== sourceEntry.integrity) {
              throw new Error(`SBOM dependency drifted from package-lock.json: ${packagePath}`);
            }
          }

          const installed = require(path.join(process.env.SBOM_DIR, 'installed.json'));
          const expected = new Set();
          function collectInstalled(dependencies = {}) {
            for (const [name, dependency] of Object.entries(dependencies)) {
              if (!dependency.version) continue;
              expected.add(`${name}@${dependency.version}`);
              collectInstalled(dependency.dependencies);
            }
          }
          collectInstalled(installed.dependencies);

          const sbom = require(process.env.SBOM_PATH);
          const actual = new Set((sbom.components || []).map((component) => {
            const name = component.group
              ? `${component.group}/${component.name}`
              : component.name;
            return `${name}@${component.version}`;
          }));
          const missing = [...expected].filter((component) => !actual.has(component));
          const unexpected = [...actual].filter((component) => !expected.has(component));
          if (missing.length || unexpected.length) {
            throw new Error(`Incomplete SBOM; missing=${missing.join(',')}; unexpected=${unexpected.join(',')}`);
          }
          NODE

          (
            cd artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: artifacts/*

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              --jq '.id')
            remote_assets=$(mktemp "$RUNNER_TEMP/usshtc107-release-assets.XXXXXX")
            trap 'rm -f -- "$remote_assets"' EXIT
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[] | @base64' > "$remote_assets"
            while IFS= read -r encoded_asset; do
              asset=$(printf '%s' "$encoded_asset" | base64 --decode)
              asset_id=$(jq -r '.id' <<<"$asset")
              asset_name=$(jq -r '.name' <<<"$asset")
              keep=false
              for local_asset in artifacts/*; do
                if [[ -f "$local_asset" && "${local_asset##*/}" == "$asset_name" ]]; then
                  keep=true
                  break
                fi
              done
              if [[ "$keep" == false ]]; then
                printf 'Deleting stale release asset: %s\n' "$asset_name"
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
            done < "$remote_assets"
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes 'Windows and macOS packages are not developer-signed or Apple-notarized. OS security warnings may appear. Verify SHA256SUMS.txt and build provenance before installing; use the official Release downloads for manual upgrades. Do not disable global OS security protections.' \
              --generate-notes
          fi
